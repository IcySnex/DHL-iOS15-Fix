name: Release

# Pushing a tag like v1.0.0 builds DHLFix.dylib and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Test
        run: make test

      - name: Build
        run: |
          make
          file build/DHLFix.dylib
          otool -l build/DHLFix.dylib | grep -A3 LC_BUILD_VERSION

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DHLFix.dylib \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
